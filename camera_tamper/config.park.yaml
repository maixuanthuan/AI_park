# Cấu hình mẫu cho công viên + test báo nhầm bằng video.
# python run_tamper.py --config config.park.yaml --log-level INFO
# Video bình thường (không có ai che camera) -> kết quả mong muốn: 0 cảnh báo.
out_dir: tamper_events_park
stats_sec: 600         # mỗi 10 phút in 1 dòng thống kê (kể cả khi mọi số bằng 0): thấy đều = hệ còn sống

source:
  hwaccel: true
  out_width: 0
  read_timeout: 10
  sample_fps: 2
  reconnect_sec: 5

detector:
  width: 320
  grid: 8
  osd_mask: []        # video có chữ / logo / đồng hồ cố định thì khai báo vùng đó ở đây
  warmup_sec: 10
  baseline_min_cells: 3 # camera nhìn hồ nước / bãi cỏ rộng thì đặt 0
  hold_sec: 10        # công viên: che camera gắn cao 3-4m cần thời gian; 10s loại chim đậu, lá rụng, cành quét qua
  clear_sec: 5
  ref_alpha: 0.02
  cell_tex_min: 30
  cell_drop_ratio: 0.25
  obstruct_frac: 0.6
  dark_thr: 15        # khu không có đèn và camera không có IR -> đặt 0
  bright_thr: 240
  min_ref_edges: 300
  edge_keep_thr: 0.35
  exit_obstruct: 0.35
  exit_edge_keep: 0.6
  frozen_sec: 10
  relearn_sec: 600
  recover_grace_sec: 60  # có hình lại sau mất tín hiệu: chờ bấy nhiêu giây mới báo sự cố mới (camera khởi động lại).
                         # Đo 1 lần 2026-10-16, PTZ văn phòng rút dây PoE: hình ổn định sau ~25s -> chọn 60 (biên ~2.4x).
                         # MẪU NHỎ, cần đo lại trên camera công viên. 0 = tắt.

cameras:
  # đặt video vào thư mục videos/ trong project, mỗi video 1 mục
  - id: park1
    url: videos/park1.mp4
  # - id: park_02
  #   url: videos/park_02.mp4
  - id: park1_tamper
    url: videos/park1_tamper.mp4
